# =============================================================================
#  配置模板（config.example.toml）
#
#  不需要手动复制：第一次运行 `python main.py` 或双击 start.bat 时，
#  程序会自动复制本文件为 config.toml，并引导你选择服务商、填写 api_key。
#
#  想手动配置也可以：复制本文件为 config.toml 后编辑：
#      Windows:  copy config.example.toml config.toml
#      macOS/Linux:  cp config.example.toml config.toml
#  config.toml 已在 .gitignore 中，不会被提交到 GitHub。
# =============================================================================

# =============================================================================
#  OCS 本地 AI 题库 · 配置文件
#
#  最省事的用法：只改 [llm] 里的 provider，再把它对应的 api_key 填上，
#  然后运行 `python main.py`。
# =============================================================================

# -----------------------------------------------------------------------------
# 服务
# -----------------------------------------------------------------------------
[server]
host = "127.0.0.1"          # 只监听本机，局域网内其它设备访问改为 "0.0.0.0"
port = 8000
public_url = ""             # 只影响命令行 `python main.py config` 的输出；网页里会自动用你访问的地址
log_level = "INFO"          # DEBUG 会打印请求细节
log_file = "data/logs/ocs.log"

# -----------------------------------------------------------------------------
# 大模型（所有兼容 OpenAI 接口的服务都能用）
# 换服务商只需改 provider，并填写对应的 api_key
# -----------------------------------------------------------------------------
[llm]
provider = "deepseek"       # deepseek / qwen / zhipu / moonshot / openai / siliconflow / ollama
timeout = 40                # 单次模型调用超时（秒）。OCS 整个请求超时为 60 秒，别设太大
max_retries = 2
temperature = 0.1
max_tokens = 1600            # 推理型模型容易写长，留点余量避免 JSON 被截断
json_mode = true            # 让模型返回 JSON；个别服务不支持时会自动降级重试
# 思考模式（DeepSeek 等支持思维链的模型）
# auto = 只在 DeepSeek 官方接口上发送 thinking 参数（避免其它厂商因未知字段报 400）
# on   = 强制开启，自建/中转的 DeepSeek 兼容接口用这个
# off  = 关闭，速度最快但复杂题准确率略降
thinking = "auto"
# 思考强度：low / high / max（服务端默认 high；low 更快，答题通常够用）
thinking_effort = "low"

# --- DeepSeek ----------------------------------------------------------------
[llm.providers.deepseek]
# 想给 DeepSeek 单独设置就写在这里（不写则沿用上面 [llm] 的值）
# thinking = "off"
# thinking_effort = "high"
base_url = "https://api.deepseek.com/"
api_key = ""                # 在这里填 sk-xxxxxx
model = "deepseek-flash"     # 或 deepseek-v4-pro（更强、更慢）
vision_model = "deepseek-flash"           # deepseek-flash 支持识图；若报不支持可改用下面的 qwen-vl

# --- 通义千问（阿里云百炼，识图推荐） -----------------------------------------
[llm.providers.qwen]
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = ""
model = "qwen-plus"
vision_model = "qwen-vl-max"

# --- 智谱 GLM ----------------------------------------------------------------
[llm.providers.zhipu]
base_url = "https://open.bigmodel.cn/api/paas/v4"
api_key = ""
model = "glm-4-flash"
vision_model = "glm-4v-flash"

# --- 月之暗面 Kimi -----------------------------------------------------------
[llm.providers.moonshot]
base_url = "https://api.moonshot.cn/v1"
api_key = ""
model = "moonshot-v1-8k"
vision_model = "moonshot-v1-8k-vision-preview"

# --- OpenAI --------------------------------------------------------------
[llm.providers.openai]
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
vision_model = "gpt-4o-mini"

# --- SiliconFlow（可白嫖部分开源模型） ----------------------------------------
[llm.providers.siliconflow]
base_url = "https://api.siliconflow.cn/v1"
api_key = ""
model = "Qwen/Qwen2.5-7B-Instruct"
vision_model = "Qwen/Qwen2-VL-72B-Instruct"

# --- 本地 Ollama -------------------------------------------------------------
[llm.providers.ollama]
base_url = "http://127.0.0.1:11434/v1"
api_key = ""
model = "qwen2.5:7b"
vision_model = "llava"

# -----------------------------------------------------------------------------
# 识图
# -----------------------------------------------------------------------------
[vision]
provider = ""               # 留空沿用 [llm] 的 provider，推荐单独设为 "qwen"
model = ""                  # 留空使用该 provider 的 vision_model
max_images = 8              # 单题最多识别几张图（图片选项题经常一张题带五六张，别设太小）
max_image_bytes = 8388608   # 单张图上限 8MB
label_images = true         # 给每张图加「第 N 张」编号，让模型能对上 [图片N]
timeout = 20

# -----------------------------------------------------------------------------
# 联网搜索（时事类题目）
# providers 按顺序尝试，第一个有结果的就用；前三个需要填 key，后两个免费
# -----------------------------------------------------------------------------
[search]
enabled = true
mode = "auto"               # auto=模型判断+关键词兜底 / always=每题都搜（慢） / never=关闭
providers = ["bing", "duckduckgo"]
max_results = 6
timeout = 10
tavily_api_key = ""
serper_api_key = ""
bocha_api_key = ""

# -----------------------------------------------------------------------------
# 题库（Markdown 缓存）
# -----------------------------------------------------------------------------
[bank]
dir = "data/bank"
file = "default.md"         # 新题写入这个文件，目录下其它 .md 也会被读取
fuzzy = true                # 题干有细微差异时也复用答案
fuzzy_threshold = 0.92
verify_options = true       # 同题干但选项不同时，不复用旧答案
option_threshold = 0.72
update_existing = true

# -----------------------------------------------------------------------------
# 行为
# -----------------------------------------------------------------------------
[behavior]
total_timeout = 55          # 单题总预算（秒），OCS 侧为 60 秒
retry_on_low_confidence = true
low_confidence = 0.45       # 模型自评低于该值时补一次联网
save_to_bank = true
max_question_chars = 2000
